ook": "Round 2 away at the Bulldogs leans toward a win, as they sit last at #18 with 1 win from 6 and a points difference of -91. Round 3 away at the Dolphins is a toss-up, as they are 6th on 3 wins and 3 losses with a points difference of +8. Round 4 away at Manly is also a toss-up, as they are 8th with the same 3-3 record and a points difference of +5. Round 5 away at Newcastle leans toward a loss, as the Knights are 3rd with 5 wins from 6 and a points difference of +82. Round 6 away at North Queensland leans toward a loss, as the Cowboys are 4th with 4 wins from 6 and a points difference of +53. All five games are on the road, so a win at the Bulldogs and a result in one of the toss-ups would keep the Tigers' season moving in the right direction.", "played": 9, "rounds": 1, "summary": "Wests Tigers, coached by HorseManSteve, sit 11th of 18 on the ladder with 6 points from three wins, no draws and three losses. The club has scored 108 points and conceded 154, a points difference of minus 46, which suggests the defence has been leaking more than the attack has been producing. The one result on record in detail is a 12-30 away loss to the Brisbane Broncos in Round 1. With the season still young, HorseManSteve has plenty of time to turn the numbers around and climb the table, but the next stretch will be a real test.", "ts": 1795410816188}], "racenotes": [{"id": "r1", "round": 1, "text": "Round 1 is done and the early separation is real. Sydney Roosters (Ethan) and Brisbane Broncos (Shiba) are both 6-0 on 12 points, split only by points difference (90 to 85), with Newcastle Knights (aonedollarcoin) a win behind on 10 and North Queensland Cowboys (Lauchlan) on 8. Those four look the safest. The bubble is crowded: Gold Coast Titans, Dolphins, Melbourne Storm and Manly Sea Eagles all sit on 6 points, with Canberra Raiders, Parramatta Eels and Wests Tigers level on 6 as well. That is seven clubs on 6 points fighting for four spots, and only points difference currently separates Manly (+5) from Canberra (-10). Below them, five clubs are on 4 points, led by St. George Illawarra (+21), while Cronulla Sharks and Canterbury Bulldogs (both on 2) are fading fastest, with Canterbury's -91 the worst on the ladder.\n\nPrediction: Roosters, Broncos, Knights, Cowboys, Titans, Dolphins, Storm and Sea Eagles make the top 8, mostly because they hold the early points or the better points difference. Manly is most likely to miss out, as it holds the last spot by just five points of difference over three clubs on the same points. The surprise could be St. George Illawarra, whose +21 difference is the best of any team outside the top eight and shows they are close to a surge.", "ts": 1795410654865}, {"id": "r5", "round": 5, "text": "After five rounds the top of the ladder is a two-horse race. The Sydney Roosters (Ethan) and Brisbane Broncos (Shiba) are both unbeaten on 10 points, with the Roosters ahead on points difference, +74 to +67. The North Queensland Cowboys and Newcastle Knights sit just behind on 8 points, each with a single loss. Manly, Canberra and the Wests Tigers are on 6 points, but the Tigers' -28 differential makes them the shakiest of the three. The cut-off is where it gets tight: Perth holds eighth on 4 points, edging Melbourne on points scored after the two finished level on differential, with the Gold Coast, the Dolphins, Penrith, Parramatta and the Warriors all on the same total. The Dragons, Sharks, Bulldogs and Rabbitohs are on 2 points, and with six or seven games left for every club, nobody is safe or out yet.\n\nPrediction: the Roosters, Broncos, Cowboys and Knights look the most likely to lock in a top-four spot, with Manly and Canberra joining them in the eight. The last two places look like a scramble between Perth, Melbourne and the Tigers, and with seven clubs bunched on 4 points, a surprise team could still steal one. The Rabbitohs, on -66, face the steepest climb.", "ts": 1794880000000}, {"id": "r6", "round": 6, "text": "The Roosters (Ethan) and Broncos (Shiba) are the only unbeaten sides after Round 6, level on 12 points, with Sydney ahead on points difference, 90 to 85. Newcastle (aonedollarcoin) sit a win back on 10, and North Queensland (Lauchlan) have 8, so those four look the safest. The real fight is for the last four spots. Six clubs are locked together on 6 points: Gold Coast, the Dolphins, Melbourne, Manly, Canberra, Parramatta and Wests Tigers, which makes seven, split only by points difference. Gold Coast lead at +28, while Manly hold eighth at just +5, with Canberra (-10) on the outside. St. George Illawarra, Perth, Penrith, South Sydney and the Warriors are all on 4 points, only one win behind, so they are still in reach with 11 games left. Cronulla and Canterbury-Bankstown, on 2 points, are fading.\n\nPrediction: I expect the top 8 to be the Roosters, Broncos, Knights, Cowboys, Titans, Dolphins, Storm and Sea Eagles. Manly look the most likely to miss out, since their margin is only five points of difference and Canberra are right behind. The Dragons are my surprise package: at +21 they have the best points difference of any side outside the eight, and a couple of wins would lift them into the pack.", "ts": 1795410842882}], "previews": [{"id": "r1", "round": 1, "text": "Round 1 of NRL Coaching Career kicks off with every club on zero points, so the ladder positions are all we have to separate the contenders from the pretenders.\n\nGames to watch:\n\nSydney Roosters v Canberra Raiders is the headline clash on paper. The Raiders sit second and the Roosters are down at 17th, yet neither side has a win, a loss or a point of difference to its name. The Roosters will want to flip that ranking at home.\n\nBrisbane Broncos v Wests Tigers pits first against 18th, the widest gap of the round. The Broncos are the benchmark and the Tigers have nothing to lose.\n\nSouth Sydney Rabbitohs v Cronulla-Sutherland Sharks sees 15th host 4th. The Sharks are the better-placed side, but  return Object.values(r).sort(srt)}

function render(){
 document.title=(S.site.title||"NRL Coaching Career");$("#tag").textContent=(S.site.tagline||"A Rugby League 26 coaching league")+" · "+(S.site.season||"Season 1");

const NM={qf1:"Qualifying Final 1",qf2:"Qualifying Final 2",ef1:"Elimination Final 1",ef2:"Elimination Final 2",sf1:"Semi Final 1",sf2:"Semi Final 2",pf1:"Preliminary Final 1",pf2:"Preliminary Final 2",gf:"Grand Final"};

function bracket(){const L=ladder().map(r=>r.id),sd=n=>L[n-1]||null,M={};
 const rs=k=>{const f=S.fin[k],m=M[k];if(!f||f.h==null||f.h===f.a)return{};const hw=f.h>f.a;return{w:hw?m.h:m.a,l:hw?m.a:m.h}};
 M.qf1={h:sd(1),a:sd(4)};M.qf2={h:sd(2),a:sd(3)};M.ef1={h:sd(5),a:sd(8)};M.ef2={h:sd(6),a:sd(7)};
 M.sf1={h:rs("qf1").l,a:rs("ef1").w};M.sf2={h:rs("qf2").l,a:rs("ef2").w};
 M.pf1={h:rs("qf1").w,a:rs("sf2").w};M.pf2={h:rs("qf2").w,a:rs("sf1").w};M.gf={h:rs("pf1").w,a:rs("pf2").w};return M}

 return `<div class="m"><div class="mu">${NM[k]}</div>${row(m.h,f.h,"h")}${row(m.a,f.a,"a")}</div>`}

function parseStand(t){const o=[];t.split("\n").forEach(l=>{l=l.replace(/[,\t|]+/g," ").trim();const m=l.match(/^(?:\d+[.)]?\s+)?([^\d]*[A-Za-z][^\d]*?)\s+((?:-?\d+\s*)+)$/);if(!m)return;const n=m[2].trim().split(/\s+/).map(Number);if(n.length<7)return;o.push({name:m[1].trim(),imp:{P:n[0],W:n[1],D:n[2],L:n[3],F:n[4],A:n[5],Pts:n[n.length-1]}})});return o}
function parseFx(t,r0){parseFx.exp=false;parseFx.sk=0;const o=[],T=[...S.teams].sort((a,b)=>b.name.length-a.name.length);let rd=+r0||1;
 t.split("\n").forEach(l=>{l=l.replace(/[\t|]+/g," ").trim();if(!l)return;
  let u=l.toLowerCase();const hits=[];T.forEach(x=>{const f=x.name.toLowerCase(),w=f.split(" ").pop();for(const n of[f,w]){if(n.length<4)continue;const i=u.indexOf(n);if(i>=0){hits.push({x,i,n:n.length});u=u.slice(0,i)+" ".repeat(n.length)+u.slice(i+n.length);break}}});
  const hm=l.match(/^\W*(?:round|rd|week|wk|r)\s*\.?\s*(\d+)\b/i);
  if(hits.length<2){if(hm){rd=+hm[1];parseFx.exp=true}else parseFx.sk++;return}hits.sort((a,b)=>a.i-b.i);const h=hits[0],a=hits[1],pm=l.slice(0,h.i).match(/(?:round|rd|week|wk)\s*\.?\s*(\d+)/i);if(pm){rd=+pm[1];parseFx.exp=true}const sc=l.slice(h.i+h.n,a.i).match(/(\d+)\s*[-–]\s*(\d+)/);
  o.push({round:rd,home:h.x.id,away:a.x.id,date:l.slice(0,h.i).replace(/round\s*\d+/i,"").trim(),venue:"",played:!!sc,hs:sc?+sc[1]:null,as:sc?+sc[2]:null})});return o}
async function impStand(){document.activeElement&&document.activeElement.blur();const rows=parseStand($("#ist").value);if(!rows.length)return msg("Couldn't read any standings rows. Paste lines like: 1 Broncos 10 8 0 2 250 120 130 16");

 await put("settings","site",{...S.site,useImp:true,impRound:Math.max(0,...rows.map(x=>x.imp.P))});msg("Imported "+rows.length+" teams with standings.")}

async function exp(k){const dl=await claude.use("downloads");if(!dl)return msg("Downloads unavailable here.");const q=x=>'"'+String(x??"").replace(/"/g,'""')+'"';
 const rows=k==="s"?[["Pos","Team","Coach","P","W","D","L","PF","PA","Pts"],...ladder().map((r,i)=>[i+1,tn(r.id),(S.teams.find(t=>t.id===r.id)||{}).coach||"",r.P,r.W,r.D,r.L,r.F,r.A,r.Pts])]:[["Round","Date","Venue","Home","Away","Home score","Away score"],...[...S.fixtures].sort(byRound).map(f=>[f.round,f.date||"",f.venue||"",tn(f.home),tn(f.away),f.played?f.hs:"",f.played?f.as:""])];

 ladder:ladder().map((r,i)=>({pos:i+1,team:tn(r.id),coach:T(r.id).coach||"",P:r.P,W:r.W,D:r.D,L:r.L,F:r.F,A:r.A,Pts:r.Pts})),
 fixtures:[...S.fixtures].sort(byRound).map(f=>({round:f.round,home:tn(f.home),away:tn(f.away),played:!!f.played,hs:f.hs??null,as:f.as??null})),

 <div class="sc"><table><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>PF</th><th>PA</th><th>Pts</th></tr>${(x.ladder||[]).map(r=>`<tr><td>${r.pos}</td><td>${esc(r.team)}<div class="mu">${esc(r.coach)}</div></td><td>${r.P}</td><td>${r.W}</td><td>${r.D}</td><td>${r.L}</td><td>${r.F}</td><td>${r.A}</td><td><b>${r.Pts}</b></td></tr>`).join("")}</table></div>

async function readPhoto(el){const fs=[...el.files],st=$("#pst");if(!fs.length)return;const rtl=$("#pdir").value==="rtl";if(rtl)fs.reverse();
 const sm=await claude.use("sample");if(!sm){st.textContent="Photo reading isn't available here.";el.value="";return}
 const names=S.teams.map(t=>t.name).join(", "),dir=rtl?"Read the columns and sections from RIGHT to LEFT (rightmost column first), top to bottom within each column.":"Read the columns and sections from left to right, top to bottom.";
 const sT=[],fT=[];let bad=0;
 for(let i=0;i<fs.length;i++){st.textContent="Reading photo "+(i+1)+" of "+fs.length+"...";
  try{const o=await aiCall(sm,`This is a screenshot or photo from LeagueRepublic showing either a standings table or a fixtures/results list. Transcribe it as plain text, one row per line, nothing else (no commentary, no markdown). ${dir}
If STANDINGS: each line "rank team P W D L PF PA Pts" (numbers only after the team name; if a points-difference column exists, put it before Pts).
If FIXTURES/RESULTS: write a line "Round N" only if the image shows that round heading (never invent one), then one line per match as "Home 18 - 12 Away" for played games or "Home v Away" for unplayed, with any date or time before the home team.
Known team names (use these spellings if they match): ${names||"none yet"}.`,{images:[fs[i]],cache:false});
  const t=(o.text||"").trim(),std=/^\s*\d+[.)]?\s+\D+\s+\d+(\s+-?\d+){6,}/m.test(t)||/^\s*\D+\s+\d+(\s+-?\d+){6,}\s*$/m.test(t);(std?sT:fT).push(t)}catch(e){bad++}}
 if(sT.length)$("#ist").value=sT.join("\n");if(fT.length)$("#ifx").value=fT.join("\n");
 st.textContent=(sT.length?"Standings text added. ":"")+(fT.length?"Fixtures text added. ":"")+(bad?bad+" photo(s) couldn't be read. ":"")+"Check it, then press Import.";el.value=""}
function layout(rows,per,start,force){
 if(parseFx.exp&&!force){const R={};rows.forEach(x=>R[x.round]=(R[x.round]||0)+1);const bad=Object.keys(R).filter(k=>R[k]!=per).map(k=>"round "+k+" has "+R[k]);
  return", rounds kept as listed"+(bad.length?". Note: "+bad.slice(0,4).join(", ")+(bad.length>4?", ...":"")+" (not "+per+" games)":"")}
 rows.forEach((x,i)=>x.round=start+Math.floor(i/per));const n=Math.ceil(rows.length/per);
 return". Split in the order listed into "+n+" round"+(n==1?"":"s")+" of "+per+" games"+(rows.length%per?" (the last has "+rows.length%per+")":"")}
function makeDraw(T,P){const N=T.length,M=N%2?N+1:N,mx=Math.floor(N/2),gpr=Math.min(P.gpr||mx,mx),rounds=P.rounds||M-1,sl=P.slots||[];
 const arr=T.map(t=>t.name);if(N%2)arr.push(null);const D=["sun","mon","tue","wed","thu","fri","sat"],Mo=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],st=P.start?new Date(P.start+"T12:00:00"):null,br=P.breaks||[];
 let wk=0;const out=[];
 for(let r=0;r<rounds;r++){const k=r%(M-1),leg=Math.floor(r/(M-1)),o=arr.slice(1),q=[arr[0],...o.slice(k),...o.slice(0,k)];let g=[];
  for(let i=0;i<M/2;i++){const a=q[i],b=q[M-1-i];if(a==null||b==null)continue;g.push(((i+k)%2)^(leg%2)?[b,a]:[a,b])}
  if(g.length>gpr){const f=(r*gpr)%g.length;g=g.slice(f).concat(g.slice(0,f)).slice(0,gpr)}
  out.push("Round "+(r+1));
  g.forEach((x,j)=>{let d="";const s=sl.length?sl[j%sl.length]:"";
   if(st){const rs=new Date(st.getTime()+wk*7*864e5),m=s.match(/^(sun|mon|tue|wed|thu|fri|sat)/i);let dt=rs;if(m)dt=new Date(rs.getTime()+((D.indexOf(m[1].toLowerCase())-rs.getDay()+7)%7)*864e5);
    d=(m?m[1]+" ":"")+dt.getDate()+" "+Mo[dt.getMonth()]+" "+s.replace(/^[a-z]+/i,"").trim()}else d=s;
   out.push((d+" "+x[0]+" v "+x[1]).trim())});
  wk++;if(br.includes(r+1))wk++}
 return{text:out.join("\n"),note:"Draw ready: "+rounds+" rounds of exactly "+gpr+" games ("+rounds*gpr+" total)"+(P.gpr>mx?". Games per round was lowered to "+mx+" because "+N+" teams can only play "+mx+" games at once":"")+(gpr<mx||N%2?", with teams resting each round":"")+". Review it in the import box, then press Import fixtures."}}
async function aiSchedule(){const T=S.teams;if(T.length<2)return msg("Add at least 2 teams first.");
 const P={rounds:+v("sr_n")||0,gpr:+v("sr_g")||0,start:v("sr_d"),slots:v("sr_s").split(",").map(x=>x.trim()).filter(Boolean),breaks:[]},notes=v("sr_t");

 S.db=db;S.me=await user.me();try{S.assets=await claude.use("assets")}catch(e){}
 db.collection("settings").doc("origin").onSnapshot(d=>{S.origin=d.exists?{games:[],...d.data()}:{games:[]};render()},()=>{});
 db.collection("previews").onSnapshot(q=>{S.previews=q.docs.map(d=>({id:d.id,...d.data()}));S.pv=true;render();autoPreview()},()=>{});
 db.collection("power").onSnapshot(q=>{S.power=q.docs.map(d=>({id:d.id,...d.data()}));S.pw=true;render();autoPower()},()=>{});
 db.collection("matchnotes").onSnapshot(q=>{S.matchnotes=q.docs.map(d=>({id:d.id,...d.data()}));S.mn=true;render();autoReports()},()=>{});
 db.collection("racenotes").onSnapshot(q=>{S.racenotes=q.docs.map(d=>({id:d.id,...d.data()}));S.rn=true;render();autoRace()},()=>{});
 db.collection("clubnotes").onSnapshot(q=>{S.clubnotes=q.docs.map(d=>({id:d.id,...d.data()}));S.cl=true;render();autoClubs()},()=>{});
 db.collection("streams").onSnapshot(q=>{S.streams=q.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{});
 db.collection("recaps").onSnapshot(q=>{S.recaps=q.docs.map(d=>({id:d.id,...d.data()}));S.rl=true;render();autoRecap()},()=>{});
 db.collection("seasons").onSnapshot(q=>{S.seasons=q.docs.map(d=>d.data());render()},()=>{});
 db.collection("settings").doc("finals").onSnapshot(d=>{S.fin=d.exists?d.data():{};render()},()=>{});
 for(const c of["teams","fixtures","news"])db.collection(c).onSnapshot(q=>{S[c]=q.docs.map(d=>({id:d.id,...d.data()}));if(c==="fixtures")S[c].sort((a,b)=>(+a.round||0)-(+b.round||0)||(a.seq||0)-(b.seq||0));render();if(c==="fixtures")autoRecap()},()=>{});
 db.collection("settings").doc("site").onSnapshot(d=>{if(d.exists)S.site={...S.site,...d.data()};S.admin=approved();render();autoRecap()},()=>{});
 S.admin=approved();render();autoRecap()}catch(e){}})();
</script></body></html>
