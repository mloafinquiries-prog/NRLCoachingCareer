try{const sd=JSON.parse(document.getElementById("seed").textContent);if(sd){Object.assign(S,{teams:sd.teams||[],fixtures:sd.fixtures||[],news:sd.news||[],fin:sd.fin||{},seasons:sd.seasons||[],recaps:sd.recaps||[],streams:sd.streams||[],clubnotes:sd.clubnotes||[]});S.site={...S.site,...sd.site}}}catch(e){}
addEventListener("hashchange",render);render();
(async()=>{try{
 const user=await claude.use("user"),db=await claude.use("db");if(!db||!user)return;
 S.db=db;S.me=await user.me();try{S.assets=await claude.use("assets")}catch(e){}
 db.collection("clubnotes").onSnapshot(q=>{S.clubnotes=q.docs.map(d=>({id:d.id,...d.data()}));S.cl=true;render();autoClubs()},()=>{});
 db.collection("streams").onSnapshot(q=>{S.streams=q.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{});
 db.collection("recaps").onSnapshot(q=>{S.recaps=q.docs.map(d=>({id:d.id,...d.data()}));S.rl=true;render();autoRecap()},()=>{});
 db.collection("seasons").onSnapshot(q=>{S.seasons=q.docs.map(d=>d.data());render()},()=>{});
 db.collection("settings").doc("finals").onSnapshot(d=>{S.fin=d.exists?d.data():{};render()},()=>{});
 for(const c of["teams","fixtures","news"])db.collection(c).onSnapshot(q=>{S[c]=q.docs.map(d=>({id:d.id,...d.data()}));if(c==="fixtures")S[c].sort((a,b)=>(+a.round||0)-(+b.round||0)||(a.seq||0)-(b.seq||0));render();if(c==="fixtures")autoRecap()},()=>{});
 db.collection("settings").doc("site").onSnapshot(d=>{if(d.exists)S.site={...S.site,...d.data()};S.admin=approved();render();autoRecap()},()=>{});
 S.admin=approved();render();autoRecap()}catch(e){}})();
</script></body></html>
